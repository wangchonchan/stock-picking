<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票自动选股系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">股票自动选股系统</h1>
        
        <div class="flex flex-wrap gap-4 mb-8 items-center justify-center">
            <div class="flex items-center gap-2">
                <label class="font-medium">选择市场：</label>
                <select id="marketSelect" class="border rounded px-3 py-2 bg-white">
                    <option value="US">美股 (US)</option>
                    <option value="HK">港股 (HK)</option>
                </select>
            </div>
            <button id="screenBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition duration-200">
                开始扫描
            </button>
            <div id="loading" class="hidden">
                <div class="loader mr-2"></div>
                <span class="text-gray-600">正在扫描中，请稍候...</span>
            </div>
        </div>

        <div id="progressPanel" class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4 hidden">
            <div class="flex justify-between items-center mb-2 text-sm font-semibold text-blue-900">
                <span id="progressText">准备开始扫描...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-blue-100 rounded-full h-3 overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div id="progressDetails" class="mt-2 text-xs text-blue-800">已扫描 0/0 | 成功 0 | 失败 0</div>
        </div>

        <div id="statusMsg" class="mb-6 text-center hidden"></div>

        <div id="resultsHeader" class="mb-4 text-center hidden">
            <h2 id="resultsTitle" class="text-2xl font-bold text-gray-700"></h2>
        </div>

        <div id="results" class="grid grid-cols-1 md:grid-cols-3 gap-6 hidden">
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                <h2 class="text-xl font-bold text-blue-800 mb-4 border-b border-blue-200 pb-2">0 < PB < 1 (破净股) <span id="sec1_count" class="text-sm font-normal"></span></h2>
                <div id="sec1_list" class="space-y-2"></div>
            </div>
            <div class="bg-green-50 p-4 rounded-lg border border-green-200">
                <h2 class="text-xl font-bold text-green-800 mb-4 border-b border-green-200 pb-2">RSI < 35 (超卖) <span id="sec2_count" class="text-sm font-normal"></span></h2>
                <div id="sec2_list" class="space-y-2"></div>
            </div>
            <div class="bg-red-50 p-4 rounded-lg border border-red-200">
                <h2 class="text-xl font-bold text-red-800 mb-4 border-b border-red-200 pb-2">RSI > 65 (超买) <span id="sec3_count" class="text-sm font-normal"></span></h2>
                <div id="sec3_list" class="space-y-2"></div>
            </div>
        </div>
        <div id="scanSummary" class="mt-6 bg-gray-50 border border-gray-200 rounded-lg p-4 hidden">
            <h3 class="text-lg font-bold text-gray-800 mb-2">扫描统计</h3>
            <div id="scanSummaryCounts" class="text-sm text-gray-700 mb-2"></div>
            <div>
                <p class="text-sm font-semibold text-gray-800">扫描失败的股票：</p>
                <div id="scanFailedList" class="text-xs text-gray-600 mt-1 break-words"></div>
            </div>
        </div>
        
        <div class="mt-12 border-t pt-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">历史扫描记录 (香港时间)</h2>
            <div id="historyList" class="flex flex-wrap gap-2">
                <p class="text-gray-500">正在加载历史记录...</p>
            </div>
        </div>
    </div>

    <script>
        const screenBtn = document.getElementById('screenBtn');
        const marketSelect = document.getElementById('marketSelect');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const resultsHeader = document.getElementById('resultsHeader');
        const resultsTitle = document.getElementById('resultsTitle');
        const statusMsg = document.getElementById('statusMsg');
        const historyList = document.getElementById('historyList');
        const scanSummary = document.getElementById('scanSummary');
        const scanSummaryCounts = document.getElementById('scanSummaryCounts');
        const scanFailedList = document.getElementById('scanFailedList');
        const progressPanel = document.getElementById('progressPanel');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const progressBar = document.getElementById('progressBar');
        const progressDetails = document.getElementById('progressDetails');
        let progressTimer = null;


        function updateUI(data) {
            resultsTitle.textContent = `${data.date} - ${data.market === 'HK' ? '港股' : '美股'} 扫描结果`;
            resultsHeader.classList.remove('hidden');
            updateList('sec1_list', data.pb_less_1, 'sec1_count');
            updateList('sec2_list', data.rsi_less_35, 'sec2_count');
            updateList('sec3_list', data.rsi_greater_65, 'sec3_count');
            results.classList.remove('hidden');
            updateSummary(data);
        }

        function updateSummary(data) {
            scanSummaryCounts.textContent = `总扫描: ${data.total_tickers || 0} | 成功: ${data.success_count || 0} | 失败: ${data.failed_count || 0}`;
            const failed = data.failed_tickers || data.failed_tickers_sample || [];
            if (!failed.length) {
                scanFailedList.textContent = '无';
            } else {
                scanFailedList.textContent = failed.map(x => `${x.ticker} (${x.reason})`).join('，');
            }
            scanSummary.classList.remove('hidden');
        }

        function updateList(containerId, stocks, countId) {
            const container = document.getElementById(containerId);
            const count = document.getElementById(countId);
            const visibleStocks = stocks || [];
            container.innerHTML = '';
            if (count) {
                count.textContent = `(${visibleStocks.length})`;
            }
            if (visibleStocks.length === 0) {
                container.innerHTML = '<p class="text-gray-500 italic">未找到符合条件的股票</p>';
                return;
            }
            visibleStocks.forEach(s => {
                const div = document.createElement('div');
                div.className = 'bg-white p-2 rounded shadow-sm flex justify-between items-center hover:bg-gray-50 transition';
                
                // Fix: Check for null/undefined instead of truthy to allow 0
                const pbVal = (s.pb !== null && s.pb !== undefined) ? s.pb.toFixed(2) : 'N/A';
                const rsiVal = (s.rsi !== null && s.rsi !== undefined) ? s.rsi.toFixed(1) : 'N/A';
                const priceVal = (s.price !== null && s.price !== undefined) ? '$' + s.price.toFixed(2) : 'N/A';

                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <a href="${s.url}" target="_blank" class="font-bold text-blue-600 hover:underline truncate block">${s.english_name || s.name}</a>
                        <div class="text-[10px] text-gray-400 truncate">${s.ticker}${s.chinese_name ? ' · ' + s.chinese_name : ''}</div>
                    </div>
                    <div class="text-right ml-2">
                        <div class="text-sm font-medium text-gray-900">${priceVal}</div>
                        <div class="text-[10px] text-gray-400 whitespace-nowrap">PB: ${pbVal} | RSI: ${rsiVal}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateProgress(job) {
            const total = job.total_tickers || 0;
            const completed = job.completed_count || 0;
            const percent = total > 0 ? Math.min(100, Math.round((completed / total) * 100)) : 0;
            progressPanel.classList.remove('hidden');
            progressText.textContent = job.message || '正在扫描中...';
            progressPercent.textContent = `${percent}%`;
            progressBar.style.width = `${percent}%`;
            progressDetails.textContent = `已扫描 ${completed}/${total} | 成功 ${job.success_count || 0} | 失败 ${job.failed_count || 0}${job.current_ticker ? ' | 当前/最近: ' + job.current_ticker : ''}`;
        }

        function stopProgressPolling() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        async function fetchProgress(jobId) {
            const res = await fetch(`/api/screen/progress/${jobId}`);
            const progress = await res.json();
            if (!progress.success) {
                throw new Error(progress.message || '读取扫描进度失败');
            }
            const job = progress.job;
            updateProgress(job);
            if (job.status === 'completed') {
                stopProgressPolling();
                loading.classList.add('hidden');
                screenBtn.disabled = false;
                updateUI(job.result);
                loadHistory();
                statusMsg.textContent = '✅ 扫描完成';
                statusMsg.className = 'mb-6 text-center text-green-600 font-bold';
                statusMsg.classList.remove('hidden');
                return true;
            }
            if (job.status === 'failed') {
                stopProgressPolling();
                loading.classList.add('hidden');
                screenBtn.disabled = false;
                statusMsg.textContent = '❌ 扫描失败: ' + (job.message || '未知错误');
                statusMsg.className = 'mb-6 text-center text-red-600 font-bold';
                statusMsg.classList.remove('hidden');
                return true;
            }
            return false;
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/records');
                const files = await res.json();
                historyList.innerHTML = '';
                if (files.length > 0) {
                    files.forEach(file => {
                        const group = document.createElement('div');
                        group.className = 'flex items-center bg-gray-200 rounded overflow-hidden';
                        
                        const btn = document.createElement('button');
                        btn.className = 'hover:bg-gray-300 px-3 py-1 text-sm transition';
                        const parts = file.split('_');
                        const datePart = parts[0];
                        const timePart = parts[1];
                        const marketPart = parts[2].split('.')[0];
                        const displayDate = `${datePart.substring(4,6)}-${datePart.substring(6,8)} ${timePart.substring(0,2)}:${timePart.substring(2,4)}`;
                        btn.textContent = `${displayDate} (${marketPart})`;
                        btn.onclick = () => loadRecordDetail(file);
                        
                        group.appendChild(btn);
                        historyList.appendChild(group);
                    });
                } else {
                    historyList.innerHTML = '<p class="text-gray-500">暂无历史记录</p>';
                }
            } catch (e) {
                historyList.innerHTML = '<p class="text-red-500">加载历史记录失败</p>';
            }
        }

        async function loadRecordDetail(filename) {
            try {
                const res = await fetch(`/api/records/${filename}`);
                const result = await res.json();
                updateUI(result);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) {
                alert("加载详情失败: " + e.message);
            }
        }

        screenBtn.addEventListener('click', async () => {
            const market = marketSelect.value;
            stopProgressPolling();
            loading.classList.remove('hidden');
            screenBtn.disabled = true;
            results.classList.add('hidden');
            resultsHeader.classList.add('hidden');
            scanSummary.classList.add('hidden');
            statusMsg.classList.add('hidden');
            updateProgress({
                total_tickers: 0,
                completed_count: 0,
                success_count: 0,
                failed_count: 0,
                message: '正在启动扫描...'
            });

            try {
                const res = await fetch('/api/screen/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ market })
                });
                const result = await res.json();
                if (!result.success) {
                    throw new Error(result.message || '启动扫描失败');
                }

                const finishedImmediately = await fetchProgress(result.job_id);
                if (finishedImmediately) {
                    return;
                }
                progressTimer = setInterval(async () => {
                    try {
                        await fetchProgress(result.job_id);
                    } catch (e) {
                        stopProgressPolling();
                        loading.classList.add('hidden');
                        screenBtn.disabled = false;
                        statusMsg.textContent = '❌ 发生错误: ' + e.message;
                        statusMsg.className = 'mb-6 text-center text-red-600 font-bold';
                        statusMsg.classList.remove('hidden');
                    }
                }, 1000);
            } catch (e) {
                stopProgressPolling();
                loading.classList.add('hidden');
                screenBtn.disabled = false;
                statusMsg.textContent = "❌ 发生错误: " + e.message;
                statusMsg.className = "mb-6 text-center text-red-600 font-bold";
                statusMsg.classList.remove('hidden');
            }
        });

        loadHistory();
    </script>
</body>
</html>
